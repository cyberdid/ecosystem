name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  linux-hosted:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[test]"
      - run: python -m unittest discover -s tests -v
      - run: python -m pytest
      - run: eco validate
      - run: eco render --check
      - run: eco doctor
      - name: Build and verify the offline distribution
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .distribution-smoke/bundle .distribution-smoke/manifest
          python -m pip wheel . --wheel-dir .distribution-smoke/bundle
          cp uv.lock .distribution-smoke/bundle/uv.lock
          main_wheel="$(basename "$(find .distribution-smoke/bundle -maxdepth 1 -name 'ai_ecosystem_harness-*.whl' -print -quit)")"
          python scripts/create_distribution_manifest.py \
            --bundle-root "$(pwd)/.distribution-smoke/bundle" \
            --main-wheel "$main_wheel" \
            --version 0.7.0 \
            --source-revision "$(git rev-parse HEAD)" \
            --output "$(pwd)/.distribution-smoke/manifest/distribution-manifest.json"
          python scripts/verify_distribution.py \
            --manifest "$(pwd)/.distribution-smoke/manifest/distribution-manifest.json" \
            --bundle-root "$(pwd)/.distribution-smoke/bundle"
          python -m venv .distribution-smoke/installed
          .distribution-smoke/installed/bin/python -m pip install \
            --no-index --find-links .distribution-smoke/bundle \
            ai-ecosystem-harness==0.7.0
          .distribution-smoke/installed/bin/eco --version
          .distribution-smoke/installed/bin/eco team --help
          .distribution-smoke/installed/bin/python - <<'PY'
          from importlib import resources

          import eco_cli.authority
          import eco_cli.team
          import eco_runtime.policy_bundle
          import eco_runtime.team_access
          import eco_runtime.team_actor
          import eco_runtime.team_approval
          import eco_runtime.team_authority
          import eco_runtime.team_identity
          import eco_runtime.team_migration
          import eco_runtime.team_rotation
          import eco_runtime.team_runtime

          schemas = (
              "identity-key.schema.json",
              "membership-binding.schema.json",
              "principal-identity.schema.json",
              "team-access-policy.schema.json",
              "team-approval.schema.json",
              "team-identity.schema.json",
              "team-key-rotation.schema.json",
              "team-policy-bundle.schema.json",
          )
          root = resources.files("eco_runtime").joinpath("schemas")
          assert all(root.joinpath(name).is_file() for name in schemas)
          PY
      - name: Report isolation-conformance scope
        run: |
          echo "### Isolation conformance" >> "$GITHUB_STEP_SUMMARY"
          echo "Hosted CI runs fail-closed unit coverage. Live namespace/Landlock conformance runs only where the host supports that kernel profile; skipped tests are not a security-pass claim." >> "$GITHUB_STEP_SUMMARY"

  adoption-portability:
    name: portability-${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[test]"
      - run: python -m unittest tests.test_cli tests.test_adoption_fixtures tests.test_adoption_safety tests.test_platform_conformance tests.test_distribution tests.test_backend_conformance tests.test_m5_identity_contracts tests.test_m5_policy_bundle tests.test_m5_authority_cli tests.test_m5_team_access tests.test_m5_team_approval tests.test_m5_team_authority tests.test_m5_team_runtime tests.test_m5_team_rotation tests.test_m5_team_cli_module -v
      - run: eco validate
      - run: eco render --check
      - run: eco doctor
