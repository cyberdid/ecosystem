name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  linux-hosted:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[test]"
      - run: python -m unittest discover -s tests -v
      - run: python -m pytest
      - run: eco validate
      - run: eco render --check
      - run: eco doctor
      - name: Report isolation-conformance scope
        run: |
          echo "### Isolation conformance" >> "$GITHUB_STEP_SUMMARY"
          echo "Hosted CI runs fail-closed unit coverage. Live namespace/Landlock conformance runs only where the host supports that kernel profile; skipped tests are not a security-pass claim." >> "$GITHUB_STEP_SUMMARY"

  adoption-portability:
    name: portability-${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[test]"
      - run: python -m unittest tests.test_cli tests.test_adoption_fixtures tests.test_adoption_safety tests.test_platform_conformance -v
      - run: eco validate
      - run: eco render --check
      - run: eco doctor
