apiVersion: ai.ecosystem/v1alpha1
kind: RuntimeTrustBootstrap
evidence:
  algorithm: HMAC-SHA256
  profile: local-shared-key
  issuers:
    - id: local-snapshot-authority
      keyId: local-snapshot-v1
      verificationKeyRef: env:ECO_SNAPSHOT_EVIDENCE_KEY
      allowedKinds:
        - RepositorySnapshot
      allowedProjects:
        - ecosystem
      allowedDeployments: []
      allowedSuiteDigests: []
    - id: local-adapter-authority
      keyId: local-adapter-v1
      verificationKeyRef: env:ECO_LOCAL_ADAPTER_EVIDENCE_KEY
      allowedKinds:
        - AdapterConformanceProfile
      allowedProjects:
        - ecosystem
      allowedDeployments:
        - local-llamacpp-gemma
      allowedSuiteDigests:
        - aa8ed45e3d481a0faf91d442dc2bc4d77f73fdd100d0eb262da64046fa441f5a
repositorySnapshot:
  issuer:
    id: local-snapshot-authority
    keyId: local-snapshot-v1
    recordIssuerType: operator
  envelopeRef: env:ECO_WIKI_SNAPSHOT_ENVELOPE_FILE
  trust: P1
  maximumFileBytes: 16777216
  entries:
    - path: wiki/index.md
      dataClass: D0
      trust: P1
      classificationAuthority: policy
    - path: wiki/architecture.md
      dataClass: D0
      trust: P1
      classificationAuthority: policy
    - path: wiki/roadmap.md
      dataClass: D0
      trust: P1
      classificationAuthority: policy
conformance:
  trustedSuites:
    - id: adapter-conformance-v1
      version: 1.0.0
      digest: aa8ed45e3d481a0faf91d442dc2bc4d77f73fdd100d0eb262da64046fa441f5a
  requiredObservations:
    - deploymentId: local-llamacpp-gemma
      suiteDigest: aa8ed45e3d481a0faf91d442dc2bc4d77f73fdd100d0eb262da64046fa441f5a
      envelopeRef: env:ECO_LOCAL_ADAPTER_ENVELOPE_FILE
